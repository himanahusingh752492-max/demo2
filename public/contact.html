<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - SmartPick Deals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* ===== Base Styles ===== */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #1e88e5;
            color: white;
            padding: 15px 30px;
            text-align: center;
        }

        header h2 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #1e88e5;
        }

        /* ===== Chat-style form ===== */
        .chat-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-form label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .chat-form input,
        .chat-form textarea {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        .chat-form textarea {
            resize: vertical;
            min-height: 100px;
        }

        .chat-form button {
            background: #1e88e5;
            color: white;
            font-size: 16px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .chat-form button:hover {
            background: #1565c0;
        }

        /* ===== Message bubbles (simulated chat) ===== */
        .messages {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 30px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 20px;
            background: #e0e0e0;
            align-self: flex-start;
        }

        .message.user {
            background: #1e88e5;
            color: white;
            align-self: flex-end;
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            header h2 {
                font-size: 20px;
            }

            .container {
                margin: 20px;
                padding: 15px;
            }

            .chat-form button {
                font-size: 14px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

<header>
    <h2>SmartPick Deals - Contact Us</h2>
</header>

<div class="container">
    <h1>Chat With Us</h1>

    <!-- Chat Messages -->
    <div class="messages" id="chatMessages">
        <!-- Messages will appear here -->
    </div>

    <!-- Chat Form -->
    <form class="chat-form" id="chatForm">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="John Doe" required>

        <label for="email">Your Email</label>
        <input type="email" id="email" placeholder="john@example.com" required>

        <label for="message">Your Message</label>
        <textarea id="message" placeholder="Type your message..." required></textarea>

        <button type="submit">Send Message</button>
    </form>
</div>

<script>
    // ===== JavaScript to display messages dynamically =====
    const form = document.getElementById('chatForm');
    const messages = document.getElementById('chatMessages');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const messageText = document.getElementById('message').value.trim();

        if(!name || !email || !messageText) return;

        // Create message bubble
        const message = document.createElement('div');
        message.classList.add('message', 'user');
        message.textContent = `${name}: ${messageText}`;
        messages.appendChild(message);

        // Scroll to bottom
        messages.scrollTop = messages.scrollHeight;

        // Reset form
        form.reset();
    });
</script>

</body>
</html>
